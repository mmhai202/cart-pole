[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-sim"
version = "0.1.0"
description = "Nonlinear cart-pole simulation with discrete LQR and video output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
optimize = ["optuna>=4.0,<5"]

[project.scripts]
cartpole-sim = "main:main"
cartpole-video = "plotting:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "configuration", "experiment", "simulation", "results", "plotting"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cartpole*"]
